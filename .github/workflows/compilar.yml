name: Compilar OfficeGo

# Compila en un Windows de verdad, que es lo que evita el lio de
# la compilacion cruzada desde Linux.
on:
  push:
    tags: ['v*']
  workflow_dispatch:      # tambien se puede lanzar a mano

permissions:
  contents: write

jobs:

  # ── la version 1.x no se compila, pero si se comprueba
  powershell:
    name: Comprobar la versión de PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sintaxis de OfficeGo.ps1
        shell: pwsh
        run: |
          $err = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/OfficeGo.ps1", [ref]$null, [ref]$err)
          if ($err) {
            $err | Select-Object -First 5 | ForEach-Object {
              Write-Host "línea $($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "Sintaxis correcta"

      - name: Pruebas del motor
        shell: pwsh
        run: ./test.ps1

      # Estas dos existen porque la 1.3 se subio rota: el arranque por
      # irm|iex no funcionaba y media interfaz no respondia a los clics.
      - name: El arranque funciona por las dos vias
        shell: pwsh
        run: ./prueba-arranque.ps1

      - name: La ventana no se solapa
        shell: pwsh
        run: |
          ./prueba-interfaz.ps1
          ./prueba-interfaz.ps1 -Factor 1.15   # con la letra mas ancha

      # Lo de arriba corre en PowerShell 7. El que trae Windows es el 5.1
      # y no lee igual: sin BOM toma el archivo como ANSI y parte los
      # acentos, que es lo que arregla la relectura de 0-parametros.ps1.
      # Aqui es el unico sitio donde eso se puede comprobar de verdad.
      - name: Lo mismo en el PowerShell que trae Windows
        shell: powershell
        run: |
          .\test.ps1
          .\prueba-arranque.ps1
          .\prueba-interfaz.ps1

      - name: Compilar OfficeGo.exe con el csc.exe de Windows
        shell: cmd
        run: call compilar-exe.bat < nul

      # Que csc.exe no proteste no quiere decir que el .exe sirva: aqui se
      # abre y se comprueba que el script que lleva dentro es el bueno.
      - name: El .exe lleva dentro lo que tiene que llevar
        shell: powershell
        run: .\prueba-exe.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: officego-powershell
          path: |
            OfficeGo.ps1
            OfficeGo.cmd
            OfficeGo.exe

  # ── la version de escritorio (Tauri + Svelte)
  escritorio:
    name: Comprobar y compilar la versión de escritorio
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: tauri
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tauri/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: tauri/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      # La app, el instalador y la ventana de novedades leen la versión de
      # Cargo.toml: una etiqueta que no coincida publicaría una versión que
      # se ofrece a sí misma como actualización.
      - name: La etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $version de Cargo.toml"; exit 1; }

      # La prueba que corre el motor de verdad (--ignored) se pasa en un
      # Windows de escritorio antes de etiquetar: el runner es un Windows
      # Server virtual, que no es donde se usa OfficeGo.
      - name: Comprobaciones
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm check
          pnpm test
          pnpm build
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml
          git diff --exit-code src/lib/generated

      # Nombres sin versión: los enlaces de /releases/latest/download/
      # valen siempre, y la app busca el instalador por «-setup.exe».
      - name: Compilar
        run: |
          pnpm tauri build
          mkdir -p ../salida
          mv src-tauri/target/release/bundle/nsis/*-setup.exe ../salida/OfficeGo-setup.exe
          cp src-tauri/target/release/officego.exe ../salida/OfficeGo-portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: officego-escritorio
          path: salida/

  # ── al etiquetar una version, se publica todo junto
  publicar:
    name: Publicar release
    needs: [powershell, escritorio]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: descargas
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: descargas/*
