[package]
name = "officego"
version = "2.4.0"
description = "Microsoft Office installer that downloads straight from Microsoft"
authors = ["Diego Fernando Loján Tenesaca", "María del Carmen Salazar Torres"]
license = "MIT"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
sha2 = "0.10"
tauri-plugin-notification = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
